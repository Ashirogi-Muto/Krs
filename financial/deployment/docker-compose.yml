# KRS Financial Management — production stack.
# Usage: docker compose -f deployment/docker-compose.yml --env-file /path/to/finance.env up -d --build
# Variable names below match backend/app/config.py exactly (ENVIRONMENT, SESSION_SECRET, FRONTEND_URL, ...).
# With ENVIRONMENT=production the backend refuses to start without PostgreSQL and a strong SESSION_SECRET.
# Ports are bound to 127.0.0.1 only; put nginx in front (route /api/* to :8050, everything else to :3050).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - krs_finance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8050}:8050"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ random characters)}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL, e.g. https://finance.example.com}
      COOKIE_SECURE: "true"
      STORAGE_TYPE: local
      LOCAL_VAULT_DIR: /app/vault
      LOG_DIR: /app/logs
    volumes:
      - krs_finance_vault:/app/vault
      - krs_finance_logs:/app/logs

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3050}:3000"
    environment:
      NODE_ENV: production

volumes:
  krs_finance_db:
  krs_finance_vault:
  krs_finance_logs:
