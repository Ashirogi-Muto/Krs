# KRS nginx site, installed at /etc/nginx/sites-available/krs by krs-pull-deploy (only after `nginx -t` passes).
# Traffic arrives through Cloudflare (proxied, SSL "Full (strict)"); the origin certificate is a Cloudflare Origin CA
# certificate for kalamroboticssociety.com + *.kalamroboticssociety.com in /etc/ssl/cloudflare/origin.{pem,key}.

# Real visitor IPs from Cloudflare (https://www.cloudflare.com/ips/)
set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;   set_real_ip_from 2606:4700::/32;   set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;   set_real_ip_from 2405:8100::/32;   set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Shared TLS + proxy settings
ssl_certificate     /etc/ssl/cloudflare/origin.pem;
ssl_certificate_key /etc/ssl/cloudflare/origin.key;
client_max_body_size 12m;          # ID cards <= 2 MB, finance receipts <= 10 MB
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 90s;

# Website + CMS
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name kalamroboticssociety.com www.kalamroboticssociety.com;
    if ($host = www.kalamroboticssociety.com) { return 301 https://kalamroboticssociety.com$request_uri; }
    location / { proxy_pass http://127.0.0.1:3003; }
}

# Short links: go.kalamroboticssociety.com/<slug> -> the site's /go/<slug>
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go.kalamroboticssociety.com;
    location / { rewrite ^/(.*)$ /go/$1 break; proxy_pass http://127.0.0.1:3003; }
}

# Finance portal, Official ledger
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finance.kalamroboticssociety.com;
    location /api/ { proxy_pass http://127.0.0.1:8051; }
    location /     { proxy_pass http://127.0.0.1:3051; }
}

# Finance portal, Unofficial ledger
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ledger.kalamroboticssociety.com;
    location /api/ { proxy_pass http://127.0.0.1:8052; }
    location /     { proxy_pass http://127.0.0.1:3052; }
}
