services:
  krs-postgres:
    image: postgres:16-alpine
    container_name: krs-website-postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krs_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-krs_db}
    # No host ports published per security rules (internal network only)
    volumes:
      - website_krs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krs_admin} -d ${POSTGRES_DB:-krs_db}"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - krs_internal

  krs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krs-website-app
    restart: unless-stopped
    ports:
      # Bound strictly to 127.0.0.1, never 0.0.0.0 or without host IP
      - "127.0.0.1:3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: "--max-old-space-size=1024"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kalamroboticssociety.com}
      STORAGE_PROVIDER: local
    volumes:
      # Persistent named volume for uploads per Item 7
      - krs_uploads:/app/public/uploads
    depends_on:
      krs-postgres:
        condition: service_healthy
    networks:
      - krs_internal

volumes:
  website_krs_postgres_data:
    external: true
  krs_uploads:
    name: website_krs_uploads

networks:
  krs_internal:
    driver: bridge
