# Builds the website Docker image on GitHub (not on the VM) and pushes it to GHCR.
# The server only pulls finished images: sudo krs-pull-deploy (or krs-deploy sha-<commit> to pin one)
name: Build website image

on:
  push:
    branches: [main, claude/deploy-ready]
    paths: ['website/**', '.github/workflows/website-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The server is arm64 (Oracle Ampere): build natively on GitHub's arm64 runner, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lower-case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/krs-website" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: website
          push: true
          build-args: NEXT_PUBLIC_SITE_URL=https://kalamroboticssociety.com
          labels: org.opencontainers.image.revision=${{ github.sha }}   # shown by: sudo krs-pull-deploy --status
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.name }}:${{ github.ref_name == 'main' && 'main' || 'deploy-ready' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the server: sudo krs-pull-deploy (or --website sha-${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
