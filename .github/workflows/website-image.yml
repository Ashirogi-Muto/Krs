# Builds the PRODUCTION website image on GitHub (never on the server) and pushes it to GHCR.
# Only from main (owner, 10 Oct 2026): changes reach main through pull requests checked by pr-checks.yml.
# The server only pulls finished images: sudo krs-pull-deploy (or krs-deploy sha-<commit> to pin one)
name: Build website image

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-image.yml']
  workflow_dispatch:

# Actions are pinned to full commit SHAs (the comment is the version): a moved tag can't change what runs here
permissions:
  contents: read
  packages: write

concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A manual run from any other branch is refused: production images come from main only
    if: github.ref == 'refs/heads/main'
    # The server is arm64 (Oracle Ampere): build natively on GitHub's arm64 runner, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Stop on a critical advisory in a production dependency (Payload's transitive "high" items have no fix yet;
      # the full list is in the job summary)
      - name: Dependency audit
        working-directory: website
        run: |
          npm audit --omit=dev >> "$GITHUB_STEP_SUMMARY" || true
          npm audit --omit=dev --audit-level=critical

      - name: Image name (lower-case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/krs-website" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: website
          push: true
          build-args: NEXT_PUBLIC_SITE_URL=https://kalamroboticssociety.com
          labels: org.opencontainers.image.revision=${{ github.sha }}   # shown by: sudo krs-pull-deploy --status
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the server: sudo krs-pull-deploy (or --website sha-${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
