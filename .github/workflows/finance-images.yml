# Builds the PRODUCTION financial app images (backend + frontend) on GitHub and pushes them to GHCR.
# Only from main (owner, 10 Oct 2026): changes reach main through pull requests checked by pr-checks.yml.
# Both ledgers (finance = Official, ledger = Unofficial) run the same images with different .env/databases.
name: Build finance images

on:
  push:
    branches: [main]
    paths: ['financial/**', '.github/workflows/finance-images.yml']
  workflow_dispatch:

# Actions are pinned to full commit SHAs (the comment is the version): a moved tag can't change what runs here
permissions:
  contents: read
  packages: write

concurrency:
  group: finance-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    # A manual run from any other branch is refused: production images come from main only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: financial/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q -p no:warnings
      # Any known vulnerability in a pinned backend dependency stops the build
      - name: Dependency audit (backend)
        run: pip install pip-audit && pip-audit -r requirements.txt --no-deps --disable-pip
      # Frontend: stop on high or critical advisories in production dependencies
      - name: Dependency audit (frontend)
        working-directory: financial/frontend
        run: npm audit --omit=dev --audit-level=high

  build:
    needs: test-backend
    # The server is arm64 (Oracle Ampere): build natively on GitHub's arm64 runner, no emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name (lower-case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/krs-finance-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: financial/${{ matrix.component }}
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}   # shown by: sudo krs-pull-deploy --status
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.name }}:main
          cache-from: type=gha,scope=finance-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=finance-${{ matrix.component }}

  # Desktop + phone screenshots of the portal with sample data (design review). Runs on GitHub's machines only.
  screenshots:
    needs: build
    runs-on: ubuntu-24.04-arm      # the images are arm64-only
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin
          POSTGRES_PASSWORD: fin
          POSTGRES_DB: fin
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fin" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start portal (throwaway ledger)
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          PW="Ci-Shots-$(openssl rand -hex 8)"; echo "SHOT_PASSWORD=$PW" >> "$GITHUB_ENV"
          mkdir -p /tmp/vault /tmp/logs && chmod 777 /tmp/vault /tmp/logs
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://fin:fin@127.0.0.1:5432/fin -e SESSION_SECRET=$(openssl rand -hex 32) \
            -e FRONTEND_URL=http://127.0.0.1:3000 -e COOKIE_SECURE=false -e ENVIRONMENT=development -e LEDGER_NAME=Official \
            -e STORAGE_TYPE=local -e ALLOW_LOCAL_STORAGE=true -e LOCAL_VAULT_DIR=/tmp/vault -e LOG_DIR=/tmp/logs \
            -e ACCOUNT_ADMIN_USERNAME=audit -e ACCOUNT_ADMIN_PASSWORD=$PW -e ACCOUNT_ADMIN_NAME="Financial Audit" \
            -e ACCOUNT_TREASURER_USERNAME=treasurer -e ACCOUNT_TREASURER_PASSWORD=$PW -e ACCOUNT_TREASURER_NAME=Treasurer \
            -v /tmp/vault:/tmp/vault -v /tmp/logs:/tmp/logs \
            ghcr.io/$OWNER/krs-finance-backend:sha-${{ github.sha }}
          docker run -d --name web --network host ghcr.io/$OWNER/krs-finance-frontend:sha-${{ github.sha }}
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8050/api/health >/dev/null && curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 2; done
          docker logs api 2>&1 | tail -5
      - name: Sample data
        run: SEED_PASSWORD=$SHOT_PASSWORD python3 financial/ui-screens/seed.py
      - name: Screenshots
        run: |
          docker run --rm --network host -e SHOT_PASSWORD=$SHOT_PASSWORD -v $PWD/financial/ui-screens:/work -w /work \
            mcr.microsoft.com/playwright:v1.48.0-jammy bash -c "npm i --silent --no-save playwright@1.48.0 >/dev/null && node shoot.mjs"
          cat financial/ui-screens/out/*-errors.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: finance-ui-screens
          path: financial/ui-screens/out/
          retention-days: 7

